name: Tag release

on:
  push:
    tags:
      - "v*"
      - "*.*.*"

permissions: {}

concurrency:
  group: tag-release-${{ github.ref }}
  cancel-in-progress: false

env:
  BUN_VERSION: "1.3.14"

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "GitHub release ${tag} already exists; keeping it"
          else
            gh release create "$tag" \
              --target "$GITHUB_SHA" \
              --title "$tag" \
              --generate-notes \
              --draft \
              --verify-tag
          fi

  build-release:
    name: build ${{ matrix.target }}
    needs: prepare-release
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-15
            bun-target: bun-darwin-arm64
            output: opencodex-darwin-arm64
          - target: darwin-x64
            runner: macos-15-intel
            bun-target: bun-darwin-x64
            output: opencodex-darwin-x64
          - target: linux-x64
            runner: ubuntu-latest
            bun-target: bun-linux-x64
            output: opencodex-linux-x64
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            bun-target: bun-linux-arm64
            output: opencodex-linux-arm64
          - target: windows-x64
            runner: windows-latest
            bun-target: bun-windows-x64
            output: opencodex-windows-x64.exe
          - target: windows-arm64
            runner: windows-11-arm
            bun-target: bun-windows-arm64
            output: opencodex-windows-arm64.exe
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build release binary
        shell: bash
        env:
          TARGET: ${{ matrix.bun-target }}
          OUTPUT: ${{ matrix.output }}
        run: |
          set -euo pipefail
          release_dir="$GITHUB_WORKSPACE/dist/release"
          mkdir -p "$release_dir"
          out="$release_dir/$OUTPUT"
          bun build --compile src/cli/index.ts --target "$TARGET" --outfile "$out"
          if [[ "$RUNNER_OS" != "Windows" ]]; then
            chmod +x "$out"
          fi
          if command -v file >/dev/null 2>&1; then
            file "$out"
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: ${{ matrix.target }}
          path: dist/release/${{ matrix.output }}
          if-no-files-found: error

  publish-release:
    name: publish release assets
    needs: build-release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Upload assets and checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd dist
          shopt -s nullglob
          assets=(opencodex-*)
          if [[ ${#assets[@]} -ne 6 ]]; then
            printf 'expected six release binaries, found %s\n' "${#assets[@]}" >&2
            printf '%s\n' "${assets[@]}" >&2
            exit 1
          fi
          sha256sum "${assets[@]}" | sort -k2 > checksums.txt
          gh release upload "$GITHUB_REF_NAME" "${assets[@]}" checksums.txt --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false
