name: Review upstream stable updates

on:
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, edited, ready_for_review]
  pull_request_review:
    types: [submitted, edited, dismissed]

permissions: {}

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  prepare:
    if: >-
      github.repository == 'ar4ft/opencodex' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: fork-upstream-maintenance
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      statuses: write
    outputs:
      check_ref: ${{ steps.update.outputs.check_ref }}
    steps:
      - name: Checkout trusted fork main
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Test trusted maintenance code
        run: python3 -m unittest discover -s scripts/tests -p test_upstream_maintenance.py -v
      - name: Prepare draft update without executing incoming code
        id: update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config --local credential.helper '!gh auth git-credential'
          python3 scripts/upstream-maintenance.py --apply

  validate:
    needs: prepare
    if: needs.prepare.outputs.check_ref != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout exact candidate with no write credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ needs.prepare.outputs.check_ref }}
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.0"
      - name: Validate fork boundaries and installer behavior
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run typecheck
          bun run privacy:scan
          bun build --compile ./src/cli/index.ts --outfile "$RUNNER_TEMP/oxc-candidate"
          OXC_TEST_BINARY="$RUNNER_TEMP/oxc-candidate" bun run test --parallel=1 \
            tests/codex-integration/fork-native-client-isolation.test.ts \
            tests/cli/fork-live-policy.test.ts \
            tests/codex-integration/github-copilot-model-discovery.test.ts \
            tests/claude-integration/claude-copilot-model.test.ts \
            tests/claude-integration/claude-fork-copilot-wire.test.ts \
            tests/claude-integration/claude-desktop-request-model.test.ts \
            tests/ci-workflows/upstream-maintenance.test.ts \
            tests/ci-workflows/standalone-installer.test.ts \
            tests/ci-workflows/tag-release-prerelease.test.ts

  report-validation:
    needs: [prepare, validate]
    if: always() && needs.prepare.outputs.check_ref != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      statuses: write
    steps:
      - name: Report exact-head Linux validation separately from human approval
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE: ${{ needs.prepare.outputs.check_ref }}
          RESULT: ${{ needs.validate.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          state=failure
          if [[ "$RESULT" == success ]]; then state=success; fi
          gh api --method POST "repos/ar4ft/opencodex/statuses/$CANDIDATE" \
            -f state="$state" -f context='upstream/fork-validation' \
            -f description="Focused Linux fork checks: $RESULT; human review still required" \
            -f target_url="$RUN_URL" >/dev/null

  human-review:
    if: >-
      github.repository == 'ar4ft/opencodex' &&
      (github.event_name == 'pull_request_target' || github.event_name == 'pull_request_review') &&
      github.event.pull_request.base.ref == 'main' &&
      startsWith(github.event.pull_request.head.ref, 'upstream-update/') &&
      github.event.pull_request.head.repo.full_name == 'ar4ft/opencodex'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: upstream-human-review-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      # Never check out or execute the PR head in this status-write job.
      - name: Checkout trusted fork main only
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: main
          persist-credentials: false
      - name: Verify current human review against current PR head
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python3 scripts/upstream-maintenance.py --review-pr "$PR_NUMBER"
